# ============================================================
# Đề 2 – Hệ thống Quản lý Sinh viên
# Commit 1: Web app + MySQL + phpMyAdmin + Nginx reverse proxy (HTTPS)
# Commit 2: Giám sát Prometheus + Grafana (cAdvisor, node-exporter, nginx-exporter, mysqld-exporter)
# Commit 3: Log tập trung Loki + Promtail, truy vấn bằng LogQL trên Grafana
# ============================================================
name: qlsv

services:
  # ---------- Reverse proxy: điểm vào duy nhất của hệ thống ----------
  nginx:
    build: ./nginx
    image: qlsv-nginx:1.0
    container_name: qlsv-nginx
    restart: unless-stopped
    ports:
      - "80:8080"     # HTTP  -> tự chuyển sang HTTPS
      - "443:8443"    # HTTPS
    depends_on:
      app:
        condition: service_healthy
      phpmyadmin:
        condition: service_started
      grafana:
        condition: service_started
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ---------- Web app quản lý sinh viên (Node.js/Express) ----------
  app:
    build: ./app
    image: qlsv-app:1.0
    container_name: qlsv-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - monitoring       # để Prometheus thu thập /metrics
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ---------- Cơ sở dữ liệu MySQL ----------
  mysql:
    image: mysql:8.4
    container_name: qlsv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend          # chỉ nằm trong mạng nội bộ, KHÔNG public cổng 3306
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------- Công cụ quản lý DB: phpMyAdmin (truy cập qua https://localhost/pma/) ----------
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: qlsv-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # ================== GIÁM SÁT (Commit 2) ==================

  # ---------- Prometheus: thu thập & lưu trữ metrics ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: qlsv-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # chỉ truy cập được từ chính máy này (không public ra mạng)
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------- Grafana: dashboard (truy cập qua https://localhost/grafana/) ----------
  grafana:
    image: grafana/grafana:11.6.0
    container_name: qlsv-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend         # để Nginx reverse proxy tới
      - monitoring       # để đọc dữ liệu từ Prometheus
    security_opt:
      - no-new-privileges:true

  # ---------- cAdvisor: metrics CPU/RAM/network của từng container ----------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: qlsv-cadvisor
    restart: unless-stopped
    privileged: true     # cAdvisor cần đọc thông tin cgroup của Docker host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring

  # ---------- node-exporter: metrics của máy chủ (CPU, RAM, disk) ----------
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: qlsv-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    read_only: true
    security_opt:
      - no-new-privileges:true

  # ---------- nginx-exporter: metrics của web server Nginx ----------
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: qlsv-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - frontend         # đọc stub_status của Nginx
      - monitoring       # cho Prometheus thu thập
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ---------- mysqld-exporter: metrics của MySQL ----------
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: qlsv-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend          # kết nối MySQL
      - monitoring       # cho Prometheus thu thập
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ================== LOG TẬP TRUNG (Commit 3) ==================

  # ---------- Loki: lưu trữ log tập trung (không public cổng) ----------
  loki:
    image: grafana/loki:3.5.7
    container_name: qlsv-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

  # ---------- Promtail: thu thập log container và đẩy về Loki ----------
  promtail:
    image: grafana/promtail:3.5.7
    container_name: qlsv-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # chỉ đọc, để đọc log container
    depends_on:
      - loki
    networks:
      - monitoring
    security_opt:
      - no-new-privileges:true

networks:
  frontend:            # Nginx <-> app, phpMyAdmin
  backend:             # app, phpMyAdmin, mysqld-exporter <-> MySQL
    internal: true     # mạng nội bộ, không ra Internet
  monitoring:          # Prometheus, Grafana, Loki, Promtail và các exporter

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  loki_data:
