# Giới hạn tốc độ request theo IP (chống spam/brute-force cơ bản)
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=20r/s;

# Hỗ trợ WebSocket cho Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (cổng 80 trên host) -> chuyển hướng toàn bộ sang HTTPS
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (cổng 443 trên host)
server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;                      # ẩn phiên bản Nginx

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;          # tắt các giao thức cũ (SSLv3, TLS 1.0/1.1)
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10m;

    # Website quản lý sinh viên -> container app:3000
    location / {
        limit_req zone=req_limit burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'" always;

        proxy_pass http://app:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Không cho truy cập metrics của app từ bên ngoài (chỉ Prometheus nội bộ được đọc)
    location = /metrics {
        return 404;
    }

    # phpMyAdmin -> container phpmyadmin:80 (không public cổng riêng)
    location = /pma {
        return 301 /pma/;
    }
    location /pma/ {
        limit_req zone=req_limit burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://phpmyadmin:80/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Grafana -> container grafana:3000 (dashboard giám sát)
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        include /etc/nginx/snippets/security-headers.conf;

        proxy_pass http://grafana:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Trang trạng thái Nginx cho nginx-exporter – chỉ nghe trong mạng Docker,
# KHÔNG publish ra host, chỉ cho phép dải IP nội bộ.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    location / {
        return 404;
    }
}
